name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Suntik API key dari Secrets
        shell: pwsh
        env:
          KEY_GEMINI: ${{ secrets.KEY_GEMINI }}
          KEY_OPENROUTER: ${{ secrets.KEY_OPENROUTER }}
          KEY_GROQ: ${{ secrets.KEY_GROQ }}
          NEXA_PROVIDER: ${{ secrets.NEXA_PROVIDER }}
          NEXA_MODEL: ${{ secrets.NEXA_MODEL }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          $html = Get-Content index.html -Raw
          if ($env:KEY_GEMINI)     { $html = $html.Replace('__KEY_GEMINI__', $env:KEY_GEMINI) }
          if ($env:KEY_OPENROUTER) { $html = $html.Replace('__KEY_OPENROUTER__', $env:KEY_OPENROUTER) }
          if ($env:KEY_GROQ)       { $html = $html.Replace('__KEY_GROQ__', $env:KEY_GROQ) }
          if ($env:NEXA_PROVIDER)  { $html = $html.Replace('__NEXA_PROVIDER__', $env:NEXA_PROVIDER) }
          if ($env:NEXA_MODEL)     { $html = $html.Replace('__NEXA_MODEL__', $env:NEXA_MODEL) }
          if ($env:WORKER_URL)     { $html = $html.Replace('__WORKER_URL__', $env:WORKER_URL) }
          Set-Content index.html -Value $html -NoNewline

      - name: Build PGBrain.exe
        run: >
          pyinstaller --onefile --noconsole --name PGBrain
          --add-data "index.html;."
          main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PGBrain-windows
          path: dist/PGBrain.exe
