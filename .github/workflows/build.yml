name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build NEXA.exe
        run: >
          pyinstaller --onefile --noconsole --name NEXA
          --add-data "index.html;."
          main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-windows
          path: dist/NEXA.exe
