name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Suntik API key dari Secrets
        shell: pwsh
        env:
          KEY_GEMINI: ${{ secrets.KEY_GEMINI }}
          KEY_OPENROUTER: ${{ secrets.KEY_OPENROUTER }}
          KEY_GROQ: ${{ secrets.KEY_GROQ }}
          KEY_OPENAI: ${{ secrets.KEY_OPENAI }}
          NEXA_PROVIDER: ${{ secrets.NEXA_PROVIDER }}
          NEXA_MODEL: ${{ secrets.NEXA_MODEL }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          HISTORY_URL: ${{ secrets.HISTORY_URL }}
        run: |
          $html = Get-Content index.html -Raw
          if ($env:KEY_GEMINI)     { $html = $html.Replace('__KEY_GEMINI__', $env:KEY_GEMINI) }
          if ($env:KEY_OPENROUTER) { $html = $html.Replace('__KEY_OPENROUTER__', $env:KEY_OPENROUTER) }
          if ($env:KEY_GROQ)       { $html = $html.Replace('__KEY_GROQ__', $env:KEY_GROQ) }
          if ($env:KEY_OPENAI)     { $html = $html.Replace('__KEY_OPENAI__', $env:KEY_OPENAI) }
          if ($env:NEXA_PROVIDER)  { $html = $html.Replace('__NEXA_PROVIDER__', $env:NEXA_PROVIDER) }
          if ($env:NEXA_MODEL)     { $html = $html.Replace('__NEXA_MODEL__', $env:NEXA_MODEL) }
          if ($env:WORKER_URL)     { $html = $html.Replace('__WORKER_URL__', $env:WORKER_URL) }
          if ($env:HISTORY_URL)    { $html = $html.Replace('__HISTORY_URL__', $env:HISTORY_URL) }
          Set-Content index.html -Value $html -NoNewline

      - name: Build PGBrain.exe
        run: >
          pyinstaller --onefile --noconsole --name PGBrain
          --icon PGBrain.ico
          --add-data "index.html;."
          main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PGBrain-windows
          path: dist/PGBrain.exe

  # ============================================================
  # Versi macOS — Apple Silicon (M1/M2/M3/M4)
  # ============================================================
  build-macos:
    # khusus Apple Silicon (M1/M2/M3/M4) — versi Intel tidak dipakai lagi
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Suntik API key dari Secrets
        env:
          KEY_GEMINI: ${{ secrets.KEY_GEMINI }}
          KEY_OPENROUTER: ${{ secrets.KEY_OPENROUTER }}
          KEY_GROQ: ${{ secrets.KEY_GROQ }}
          KEY_OPENAI: ${{ secrets.KEY_OPENAI }}
          NEXA_PROVIDER: ${{ secrets.NEXA_PROVIDER }}
          NEXA_MODEL: ${{ secrets.NEXA_MODEL }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          HISTORY_URL: ${{ secrets.HISTORY_URL }}
        run: |
          python3 - << 'EOF'
          import os
          html = open('index.html', encoding='utf-8').read()
          pairs = {
            '__KEY_GEMINI__':     os.environ.get('KEY_GEMINI',''),
            '__KEY_OPENROUTER__': os.environ.get('KEY_OPENROUTER',''),
            '__KEY_GROQ__':       os.environ.get('KEY_GROQ',''),
            '__KEY_OPENAI__':     os.environ.get('KEY_OPENAI',''),
            '__NEXA_PROVIDER__':  os.environ.get('NEXA_PROVIDER',''),
            '__NEXA_MODEL__':     os.environ.get('NEXA_MODEL',''),
            '__WORKER_URL__':     os.environ.get('WORKER_URL',''),
            '__HISTORY_URL__':    os.environ.get('HISTORY_URL',''),
          }
          for token, val in pairs.items():
              if val:
                  html = html.replace(token, val)
          open('index.html', 'w', encoding='utf-8').write(html)
          EOF

      - name: Build PGBrain.app
        # perhatikan: pemisah --add-data di macOS adalah ':' (di Windows ';')
        run: >
          pyinstaller --onefile --windowed --name PGBrain
          --icon PGBrain.icns
          --add-data "index.html:."
          main.py

      - name: Zip .app (agar izin & struktur bundle tetap utuh)
        run: ditto -c -k --sequesterRsrc --keepParent dist/PGBrain.app PGBrain-macos-apple-silicon.zip

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: PGBrain-macos-apple-silicon
          path: PGBrain-macos-apple-silicon.zip
