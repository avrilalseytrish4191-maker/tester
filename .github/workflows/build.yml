name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Suntik API key dari Secrets
        shell: pwsh
        env:
          NEXA_API_KEY: ${{ secrets.NEXA_API_KEY }}
          NEXA_PROVIDER: ${{ secrets.NEXA_PROVIDER }}
          NEXA_MODEL: ${{ secrets.NEXA_MODEL }}
        run: |
          $html = Get-Content index.html -Raw
          if ($env:NEXA_API_KEY) { $html = $html.Replace('__NEXA_API_KEY__', $env:NEXA_API_KEY) }
          if ($env:NEXA_PROVIDER) { $html = $html.Replace('__NEXA_PROVIDER__', $env:NEXA_PROVIDER) }
          if ($env:NEXA_MODEL) { $html = $html.Replace('__NEXA_MODEL__', $env:NEXA_MODEL) }
          Set-Content index.html -Value $html -NoNewline

      - name: Build NEXA.exe
        run: >
          pyinstaller --onefile --noconsole --name PGBrain
          --add-data "index.html;."
          main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PGBrain-windows
          path: dist/PGBrain.exe
